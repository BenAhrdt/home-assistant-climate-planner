name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python tests and checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements_test.txt
      - name: Run Ruff
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Compile Python files
        run: python -m compileall -q custom_components tests
      - name: Validate JSON files
        run: |
          python -m json.tool custom_components/climate_planner/manifest.json >/dev/null
          python -m json.tool custom_components/climate_planner/strings.json >/dev/null
          python -m json.tool custom_components/climate_planner/translations/de.json >/dev/null
          python -m json.tool custom_components/climate_planner/translations/en.json >/dev/null
      - name: Run tests
        env:
          PYTHONPATH: .
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest -p pytest_asyncio.plugin -q
