blueprint:
  name: Kalenderereignis mit Textfilter
  description: >-
    Führt getrennte Aktionsfolgen aus, wenn ein Kalenderereignis den
    konfigurierten Textfilter erfüllt beziehungsweise nicht mehr erfüllt.
    Der Filter wird gegen den Ereignistitel (summary) geprüft. Es können
    mehrere Filtertexte mit ODER- oder UND-Verknüpfung verwendet werden. Für
    beide Fälle können Beginn oder Ende des Ereignisses sowie ein eigener
    Zeitversatz gewählt werden.
  domain: automation
  homeassistant:
    min_version: "2026.2.0"
  source_url: https://github.com/BenAhrdt/home-assistant-climate-planner/blob/main/Blueprint/calendar_event_filter.yaml
  input:
    calendar_entities:
      name: Kalender
      description: Ein oder mehrere Kalender, die überwacht werden sollen.
      selector:
        entity:
          multiple: true
          filter:
            - domain: calendar

    filter_text:
      name: Filtertexte
      description: >-
        Die Texte, die im Ereignistitel gesucht werden. Über "Weiteren
        Filtertext hinzufügen" können mehrere Filtertexte erfasst werden. Alle
        Texte leer lassen, um auf jeden Kalendereintrag zu reagieren.
      default: []
      selector:
        text:
          type: search
          multiple: true

    filter_logic:
      name: Filterverknüpfung
      description: Ob ein oder alle Filtertexte zutreffen müssen.
      default: or
      selector:
        select:
          options:
            - label: Ein Textfilter muss zutreffen (ODER)
              value: or
            - label: Alle Textfilter müssen zutreffen (UND)
              value: and

    filter_mode:
      name: Filtervergleich
      description: Groß-/Kleinschreibung wird nicht berücksichtigt.
      default: contains
      selector:
        select:
          options:
            - label: Enthält
              value: contains
            - label: Exakt
              value: exact

    match_event:
      name: Zeitpunkt für "Trifft zu"
      description: Beginn oder Ende des passenden Ereignisses.
      default: start
      selector:
        select:
          options:
            - label: Bei Beginn
              value: start
            - label: Bei Ende
              value: end

    match_offset:
      name: Zeitversatz für "Trifft zu"
      description: >-
        Vor oder nach dem gewählten Ereigniszeitpunkt. Die Eingabe ist der
        Zeitversatz zum gewählten Kalenderereignis.
      default:
        offset_type: before
        offset:
          days: 0
          hours: 4
          minutes: 0
          seconds: 0
      selector:
        object:
          fields:
            offset_type:
              label: Richtung
              required: true
              default: before
              selector:
                select:
                  options:
                    - label: Vorher
                      value: before
                    - label: Nachher
                      value: after
            offset:
              label: Zeitversatz
              required: true
              selector:
                object:
                  fields:
                    days:
                      label: Tage
                      required: true
                      default: 0
                      selector:
                        number:
                          min: 0
                          mode: box
                    hours:
                      label: Stunden
                      required: true
                      default: 4
                      selector:
                        number:
                          min: 0
                          mode: box
                    minutes:
                      label: Minuten
                      required: true
                      default: 0
                      selector:
                        number:
                          min: 0
                          mode: box
                    seconds:
                      label: Sekunden
                      required: true
                      default: 0
                      selector:
                        number:
                          min: 0
                          mode: box

    matched_actions:
      name: Aktionen bei "Trifft zu"
      description: Aktionen, die beim passenden Kalenderereignis ausgeführt werden.
      default: []
      selector:
        action:

    no_match_event:
      name: Zeitpunkt für "Trifft nicht mehr zu"
      description: Beginn oder Ende des Ereignisses, an dem der Filter nicht mehr gilt.
      default: end
      selector:
        select:
          options:
            - label: Bei Beginn
              value: start
            - label: Bei Ende
              value: end

    no_match_offset:
      name: Zeitversatz für "Trifft nicht mehr zu"
      description: >-
        Vor oder nach dem gewählten Ereigniszeitpunkt. Die Eingabe ist der
        Zeitversatz zum gewählten Kalenderereignis.
      default:
        offset_type: before
        offset:
          days: 2
          hours: 0
          minutes: 0
          seconds: 0
      selector:
        object:
          fields:
            offset_type:
              label: Richtung
              required: true
              default: before
              selector:
                select:
                  options:
                    - label: Vorher
                      value: before
                    - label: Nachher
                      value: after
            offset:
              label: Zeitversatz
              required: true
              selector:
                object:
                  fields:
                    days:
                      label: Tage
                      required: true
                      default: 2
                      selector:
                        number:
                          min: 0
                          mode: box
                    hours:
                      label: Stunden
                      required: true
                      default: 0
                      selector:
                        number:
                          min: 0
                          mode: box
                    minutes:
                      label: Minuten
                      required: true
                      default: 0
                      selector:
                        number:
                          min: 0
                          mode: box
                    seconds:
                      label: Sekunden
                      required: true
                      default: 0
                      selector:
                        number:
                          min: 0
                          mode: box

    no_match_actions:
      name: Aktionen bei "Trifft nicht mehr zu"
      description: Aktionen, die ausgeführt werden, wenn der passende Zeitraum endet.
      default: []
      selector:
        action:

variables:
  filter_value: !input filter_text
  filter_logic_value: !input filter_logic
  filter_comparison: !input filter_mode
  selected_match_event: !input match_event
  selected_no_match_event: !input no_match_event

triggers:
  - trigger: calendar.event_started
    id: matched_start
    target:
      entity_id: !input calendar_entities
    options: !input match_offset
  - trigger: calendar.event_ended
    id: matched_end
    target:
      entity_id: !input calendar_entities
    options: !input match_offset
  - trigger: calendar.event_started
    id: no_match_start
    target:
      entity_id: !input calendar_entities
    options: !input no_match_offset
  - trigger: calendar.event_ended
    id: no_match_end
    target:
      entity_id: !input calendar_entities
    options: !input no_match_offset

conditions:
  - condition: template
    value_template: >-
      {% set summary = trigger.calendar_event.summary | default('', true) | string | trim | lower %}
      {% set matched_trigger = 'matched_' ~ selected_match_event %}
      {% set no_match_trigger = 'no_match_' ~ selected_no_match_event %}
      {% if trigger.id not in [matched_trigger, no_match_trigger] %}
        false
      {% else %}
        {% set raw_filter_values = filter_value | default([], true) %}
        {% if raw_filter_values is string %}
          {% set raw_filter_values = [raw_filter_values] %}
        {% endif %}
        {% set normalized_filters = namespace(items=[]) %}
        {% for value in raw_filter_values %}
          {% set normalized_value = value | string | trim | lower %}
          {% if normalized_value %}
            {% set normalized_filters.items = normalized_filters.items + [normalized_value] %}
          {% endif %}
        {% endfor %}
        {% set matched_count = namespace(value=0) %}
        {% for filter_value_item in normalized_filters.items %}
          {% if filter_comparison == 'exact' and summary == filter_value_item %}
            {% set matched_count.value = matched_count.value + 1 %}
          {% elif filter_comparison != 'exact' and filter_value_item in summary %}
            {% set matched_count.value = matched_count.value + 1 %}
          {% endif %}
        {% endfor %}
        {% if normalized_filters.items | length == 0 %}
          true
        {% elif filter_logic_value == 'and' %}
          {{ matched_count.value == normalized_filters.items | length }}
        {% else %}
          {{ matched_count.value > 0 }}
        {% endif %}
      {% endif %}

actions:
  - choose:
      - conditions:
          - condition: template
            value_template: >-
              {{ trigger.id == ('matched_' ~ selected_match_event) }}
        sequence: !input matched_actions
      - conditions:
          - condition: template
            value_template: >-
              {{ trigger.id == ('no_match_' ~ selected_no_match_event) }}
        sequence: !input no_match_actions

mode: queued
